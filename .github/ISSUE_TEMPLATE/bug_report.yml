name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: input
    id: mac
    attributes:
      label: Mac model
      placeholder: e.g. MacBook Air M3
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 26.1
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, anything else
